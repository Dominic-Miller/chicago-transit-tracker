spring.application.name=open-transit-chicago
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.error.include-message=always
server.port=${PORT:8080}
server.forward-headers-strategy=framework
cta.api-key=${CTA_API_KEY:}
cta.bus-api-key=${CTA_BUS_API_KEY:}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://localhost:5173,https://127.0.0.1:5173}
app.rate-limit.requests=${APP_RATE_LIMIT_REQUESTS:300}
app.rate-limit.window-seconds=${APP_RATE_LIMIT_WINDOW_SECONDS:300}
